<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jass Pizza — Ask our assistant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0D0B}
a{color:#C9A24A}a:hover{color:#E2C47A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'DM Sans', sans-serif; color: #F4EEE2; background: #0E0D0B">

<header style="padding: 20px 20px 16px; border-bottom: 1px solid rgba(201,162,74,0.3); display: flex; align-items: center; gap: 14px">
<a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4EEE2">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-weight: 700; color: {{accent}}; font-size: 20px">J</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 600">Ask Jass Pizza</span>
<span style="font-size: 12px; color: #B8AF9E">AI assistant · a real person follows up</span>
</div>
</header>

<div aria-live="polite" style="flex: 1 1 auto; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{ messages }}" as="m" hint-placeholder-count="3">
<div style="{{ m.style }}">{{ m.text }}</div>
</sc-for>
<sc-if value="{{ showCta }}" hint-placeholder-val="{{ false }}">
<a href="Book.dc.html" style="align-self: flex-start; background: {{accent}}; color: #0E0D0B; text-decoration: none; font-weight: 700; padding: 14px 20px; border-radius: 2px; font-size: 15px">Check your date</a>
</sc-if>
</div>

<div style="padding: 12px 20px 0; display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{ c.ask }}" style="flex: 0 0 auto; font: inherit; font-size: 14px; min-height: 44px; padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(201,162,74,0.5); background: transparent; color: #F4EEE2; cursor: pointer; white-space: nowrap">{{ c.q }}</button>
</sc-for>
</div>

<form style="padding: 12px 20px 24px; display: flex; gap: 10px; align-items: center">
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Your question</label>
<input id="msg" type="text" placeholder="Ask about menu, setup, dates…" style="flex: 1 1 auto; min-width: 0; font: inherit; font-size: 15px; color: #F4EEE2; background: #15130F; border: 1px solid rgba(201,162,74,0.4); border-radius: 999px; padding: 12px 18px; min-height: 48px; box-sizing: border-box">
<button type="button" aria-label="Send" style="width: 48px; height: 48px; flex: 0 0 auto; border-radius: 50%; border: 0; background: {{accent}}; color: #0E0D0B; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C9A24A","options":["#C9A24A","#D4AF37","#B8924A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { log: [
{ from: 'bot', text: 'Hi! I can answer questions about our menu, packages and setup. What are you planning?' },
{ from: 'me', text: 'Do you have vegetarian options?' },
{ from: 'bot', text: 'Yes, all four core flavours are vegetarian: Margherita, Roasted Bianca, Paneer Tikka Delight and Garden Veggie. Tandoori chicken is available as an add-on.' }
], cta: false };
}
renderVals() {
const accent = this.props.accent ?? '#C9A24A';
const answers = {
'How much for 50 guests?': ['For around 50 guests most hosts choose our Celebration or Grand package. Every quote is personal, so Jassi will send yours directly. Want to check your date?', true],
'How far ahead to book?': ['At least 15 days before your event, since we notify Peel Public Health for every booking. Weekends fill first, so earlier is better.', false],
'Do you travel to Toronto?': ['Yes, we serve the whole GTA. A travel fee applies outside Peel Region.', false],
'What space do you need?': ['[Your setup footprint and power or propane needs]', false]
};
const bubble = (from) => from === 'me'
? 'align-self: flex-end; max-width: 80%; background: ' + accent + '; color: #0E0D0B; padding: 12px 16px; border-radius: 18px 18px 4px 18px; font-size: 15px; line-height: 1.45'
: 'align-self: flex-start; max-width: 85%; background: #1C1A15; border: 1px solid rgba(201,162,74,0.25); padding: 12px 16px; border-radius: 18px 18px 18px 4px; font-size: 15px; line-height: 1.5';
return {
accent,
messages: this.state.log.map((m) => ({ text: m.text, style: bubble(m.from) })),
showCta: this.state.cta,
chips: Object.keys(answers).map((q) => ({ q, ask: () => this.setState({ log: this.state.log.concat([{ from: 'me', text: q }, { from: 'bot', text: answers[q][0] }]), cta: answers[q][1] || this.state.cta }) }))
};
}
}
</script>
</body>
</html>
